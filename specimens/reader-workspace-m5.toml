[screen]
id = "reader_workspace_m5"
purpose = "Read a document while controlling navigation and narration"
root = "workspace"

[tokens.spacing]
sm = 8
md = 12

[[region]]
id = "app_commands"
role = "commands"
importance = "secondary"
height = "52px"
[[region]]
id = "library"
role = "navigation"
importance = "secondary"
width = "250px"
[[region]]
id = "reader"
role = "primary_content"
importance = "primary"
grow = 1
[[region]]
id = "inspector"
role = "inspector"
importance = "tertiary"
width = "300px"
[[region]]
id = "transport"
role = "commands"
importance = "secondary"
height = "68px"

[[composition]]
id = "workspace"
kind = "column"
axis = "vertical"
children = ["app_commands", "reading_body", "transport"]
gap = "sm"
padding = "md"
[[composition]]
id = "reading_body"
kind = "split"
axis = "horizontal"
children = ["library", "reader", "inspector"]
gap = "md"
grow = 1

[[element]]
id = "open_document"
region = "app_commands"
kind = "command"
importance = "secondary"
label = "Open"
[[element]]
id = "library_search"
region = "library"
kind = "search"
importance = "secondary"
label = "Search library"
[[element]]
id = "document_outline"
region = "library"
kind = "tree"
importance = "secondary"
label = "Contents"
[[element]]
id = "document_surface"
region = "reader"
kind = "document"
importance = "primary"
label = "Document"
[[element]]
id = "reader_settings"
region = "inspector"
kind = "property_sheet"
importance = "tertiary"
label = "Reading settings"
[[element]]
id = "play_pause"
region = "transport"
kind = "command"
importance = "primary"
label = "Play / pause"
[[element]]
id = "voice"
region = "transport"
kind = "command"
importance = "secondary"
label = "Voice"
[[element]]
id = "reading_status"
region = "transport"
kind = "status"
importance = "tertiary"
label = "Reading status"

[[fixture]]
id = "reading"
state = "document_loaded"
[[fixture.content]]
element = "document_outline"
nodes = [
  { id = "introduction", label = "Introduction" },
  { id = "part_one", label = "Part I · The City" },
  { id = "chapter_one", label = "Chapter 1 · Windows", parent = "part_one" },
  { id = "chapter_two", label = "Chapter 2 · The Quiet Machine", parent = "part_one" },
  { id = "part_two", label = "Part II · After Rain" },
]
selected = "chapter_two"
[[fixture.content]]
element = "document_surface"
document = { title = "The Quiet Machine", paragraphs = ["Rain gathered against the windows.", "The machine remained awake beneath the low electrical hum."] }
[[fixture.content]]
element = "reader_settings"
properties = [{ name = "Voice", value = "Avery" }]
[[fixture.content]]
element = "reading_status"
text = "Ready to read"

[[fixture]]
id = "empty"
state = "no_document"
[[fixture.content]]
element = "document_outline"
nodes = []
[[fixture.content]]
element = "document_surface"
document = { title = "No document loaded", paragraphs = [] }
[[fixture.content]]
element = "reader_settings"
properties = []
[[fixture.content]]
element = "reading_status"
text = "Open a document to begin reading"
