[screen]
id = "reader_workspace_visual_m5"
purpose = "Read a document in a calm, deliberate workspace"
root = "workspace"

[tokens.spacing]
sm = 8
md = 12
[tokens.corners]
medium = 7
[tokens.color]
canvas = "#101216"
surface = "#171A20"
surface_raised = "#1E222A"
text = "#E8EAF0"
text_muted = "#9299A6"
accent = "#8DB7C7"
border = "#2B313B"
[tokens.type]
display = 26
heading = 18
body = 14
caption = 12
[visual]
canvas = "canvas"
surface = "surface"
surface_raised = "surface_raised"
text = "text"
text_muted = "text_muted"
accent = "accent"
border = "border"
corner = "medium"
border_policy = "minimal"

[[region]]
id = "app_commands"
role = "commands"
importance = "secondary"
surface = "transparent"
height = "52px"
[[region]]
id = "library"
role = "navigation"
importance = "secondary"
surface = "panel"
width = "250px"
[[region]]
id = "reader"
role = "primary_content"
importance = "primary"
surface = "canvas"
grow = 1
[[region]]
id = "inspector"
role = "inspector"
importance = "tertiary"
surface = "panel"
width = "300px"
[[region]]
id = "transport"
role = "commands"
importance = "secondary"
surface = "raised"
height = "68px"
[[composition]]
id = "workspace"
kind = "column"
axis = "vertical"
children = ["app_commands", "reading_body", "transport"]
gap = "sm"
padding = "md"
[[composition]]
id = "reading_body"
kind = "split"
axis = "horizontal"
children = ["library", "reader", "inspector"]
gap = "md"
grow = 1
[[element]]
id = "document_outline"
region = "library"
kind = "tree"
importance = "secondary"
label = "Contents"
[[element]]
id = "document_surface"
region = "reader"
kind = "document"
importance = "primary"
label = "Document"
[[element]]
id = "reader_settings"
region = "inspector"
kind = "property_sheet"
importance = "tertiary"
label = "Reading settings"
[[element]]
id = "reading_status"
region = "transport"
kind = "status"
importance = "tertiary"
label = "Reading status"
[[fixture]]
id = "reading"
state = "document_loaded"
[[fixture.content]]
element = "document_outline"
nodes = [{ id = "introduction", label = "Introduction" }, { id = "part_one", label = "Part I · The City" }, { id = "chapter_two", label = "Chapter 2 · The Quiet Machine", parent = "part_one" }]
selected = "chapter_two"
[[fixture.content]]
element = "document_surface"
document = { title = "The Quiet Machine", paragraphs = ["Rain gathered against the windows.", "The machine remained awake beneath the low electrical hum."] }
[[fixture.content]]
element = "reader_settings"
properties = [{ name = "Voice", value = "Avery" }]
[[fixture.content]]
element = "reading_status"
text = "Ready to read"
[[fixture]]
id = "empty"
state = "no_document"
[[fixture.content]]
element = "document_outline"
nodes = []
[[fixture.content]]
element = "document_surface"
document = { title = "No document loaded", paragraphs = [] }
[[fixture.content]]
element = "reader_settings"
properties = []
[[fixture.content]]
element = "reading_status"
text = "Open a document to begin reading"
