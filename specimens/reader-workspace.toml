[screen]
id = "reader_workspace"
purpose = "Read a document while controlling navigation and narration"
density = "comfortable"
root = "workspace"

[design]
character = ["quiet", "focused", "crafted", "reading_first"]
dominant = "reader"
avoid = ["toolbar_dominance", "uniform_visual_weight", "nested_card_soup", "border_everything", "control_clutter"]

[tokens.spacing]
xs = 4
sm = 8
md = 12
lg = 16
xl = 24

[tokens.corners]
small = 4
medium = 7

[[region]]
id = "app_commands"
role = "commands"
importance = "secondary"
height = "52px"

[[region]]
id = "library"
role = "navigation"
importance = "secondary"
width = "250px"

[[region]]
id = "reader"
role = "primary_content"
importance = "primary"
grow = 1

[[region]]
id = "inspector"
role = "inspector"
importance = "tertiary"
width = "300px"

[[region]]
id = "transport"
role = "commands"
importance = "secondary"
height = "68px"

[[composition]]
id = "workspace"
kind = "column"
axis = "vertical"
children = ["app_commands", "reading_body", "transport"]
gap = "sm"
padding = "md"

[[composition]]
id = "reading_body"
kind = "split"
axis = "horizontal"
children = ["library", "reader", "inspector"]
gap = "md"
grow = 1

[[element]]
id = "open_document"
region = "app_commands"
kind = "command"
importance = "secondary"
label = "Open"
action = "document.open"

[[element]]
id = "library_search"
region = "library"
kind = "search"
importance = "secondary"
label = "Search library"

[[element]]
id = "document_outline"
region = "library"
kind = "tree"
importance = "secondary"
label = "Contents"

[[element]]
id = "document_surface"
region = "reader"
kind = "document"
importance = "primary"
label = "Document"

[[element]]
id = "reader_settings"
region = "inspector"
kind = "property_sheet"
importance = "tertiary"
label = "Reading settings"

[[element]]
id = "play_pause"
region = "transport"
kind = "command"
importance = "primary"
label = "Play / pause"
action = "reader.play_pause"

[[element]]
id = "voice"
region = "transport"
kind = "command"
importance = "secondary"
label = "Voice"
action = "reader.choose_voice"

[[element]]
id = "speed"
region = "transport"
kind = "command"
importance = "secondary"
label = "Speed"
action = "reader.choose_speed"

[[element]]
id = "reading_status"
region = "transport"
kind = "status"
importance = "tertiary"
label = "Reading status"

[[fixture]]
id = "reading"
state = "document_loaded"
[[fixture.content]]
element = "document_outline"
nodes = [
  { id = "introduction", label = "Introduction" },
  { id = "part_one", label = "Part I · The City" },
  { id = "chapter_one", label = "Chapter 1 · Windows", parent = "part_one" },
  { id = "chapter_two", label = "Chapter 2 · The Quiet Machine", parent = "part_one" },
  { id = "part_two", label = "Part II · After Rain" },
]
selected = "chapter_two"
[[fixture.content]]
element = "document_surface"
document = { title = "The Quiet Machine", paragraphs = ["Rain gathered against the windows while the city settled into its evening rhythm.", "The machine remained awake beneath the low electrical hum, listening to the rooms around it.", "By morning, every quiet signal had found its way home."] }
[[fixture.content]]
element = "reader_settings"
properties = [
  { name = "Voice", value = "Avery" },
  { name = "Speed", value = "1.0×" },
  { name = "Display", value = "Focused" },
]
[[fixture.content]]
element = "reading_status"
text = "Ready to read · 12 min remaining"

[[fixture]]
id = "selected_chapter"
state = "outline_selection"
[[fixture.content]]
element = "document_outline"
nodes = [
  { id = "introduction", label = "Introduction" },
  { id = "part_one", label = "Part I · The City" },
  { id = "chapter_one", label = "Chapter 1 · Windows", parent = "part_one" },
  { id = "chapter_two", label = "Chapter 2 · The Quiet Machine", parent = "part_one" },
  { id = "part_two", label = "Part II · After Rain" },
]
selected = "chapter_one"
[[fixture.content]]
element = "document_surface"
document = { title = "The Quiet Machine", paragraphs = ["The city kept its own time beneath the rain."] }
[[fixture.content]]
element = "reader_settings"
properties = [
  { name = "Voice", value = "Avery" },
  { name = "Speed", value = "1.0×" },
  { name = "Display", value = "Focused" },
