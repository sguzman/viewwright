[[fixture.content]]
element = "document_surface"
document = { title = "The Quiet Machine", paragraphs = ["The machine remained awake beneath the low electrical hum."] }
[[fixture.content]]
element = "reader_settings"
properties = [
  { name = "Voice", value = "Avery" },
  { name = "Speed", value = "1.0×" },
  { name = "Display", value = "Focused" },
