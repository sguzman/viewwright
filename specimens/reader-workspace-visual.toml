# Schema-pressure specimen for M2 visual authoring.
#
# This is intentionally a full screen rather than a style fragment. The point is
# to prove that structural and visual authorship can coexist in one canonical
# blueprint without collapsing into toolkit-specific styling.

[screen]
id = "reader_workspace_visual"
purpose = "Read a document in a calm, deliberate workspace"
density = "comfortable"
root = "workspace"

[design]
character = ["quiet", "focused", "crafted", "reading_first", "restrained"]
dominant = "reader"
avoid = [
    "toolbar_dominance",
    "uniform_visual_weight",
    "nested_card_soup",
    "border_everything",
    "control_clutter",
    "pill_soup",
]

[tokens.spacing]
xs = 4
sm = 8
md = 12
lg = 16
xl = 24

[tokens.corners]
small = 4
medium = 7

[tokens.color]
canvas = "#101216"
surface = "#171A20"
surface_raised = "#1E222A"
text = "#E8EAF0"
text_muted = "#9299A6"
accent = "#8DB7C7"
border = "#2B313B"

[tokens.type]
display = 26
heading = 18
body = 14
caption = 12

[visual]
canvas = "canvas"
surface = "surface"
surface_raised = "surface_raised"
text = "text"
text_muted = "text_muted"
accent = "accent"
border = "border"
corner = "medium"
border_policy = "minimal"

[[region]]
id = "app_commands"
role = "commands"
importance = "secondary"
surface = "transparent"
height = "52px"

[[region]]
id = "library"
role = "navigation"
importance = "secondary"
surface = "panel"
width = "250px"

[[region]]
id = "reader"
role = "primary_content"
importance = "primary"
surface = "canvas"
grow = 1

[[region]]
id = "inspector"
role = "inspector"
importance = "tertiary"
surface = "panel"
width = "300px"

[[region]]
id = "transport"
role = "commands"
importance = "secondary"
surface = "raised"
height = "68px"

[[composition]]
id = "workspace"
kind = "column"
axis = "vertical"
children = ["app_commands", "reading_body", "transport"]
gap = "sm"
padding = "md"

[[composition]]
id = "reading_body"
kind = "split"
axis = "horizontal"
children = ["library", "reader", "inspector"]
gap = "md"

[[element]]
id = "open_document"
region = "app_commands"
kind = "command"
importance = "secondary"
label = "Open"

[[element]]
id = "library_search"
region = "library"
kind = "search"
importance = "secondary"
label = "Search library"

[[element]]
id = "document_outline"
region = "library"
kind = "tree"
importance = "secondary"
label = "Contents"

[[element]]
id = "document_surface"
region = "reader"
kind = "document"
importance = "primary"
label = "Document"

[[element]]
id = "reader_settings"
region = "inspector"
kind = "property_sheet"
importance = "tertiary"
label = "Reading settings"

[[element]]
id = "play_pause"
region = "transport"
kind = "command"
importance = "primary"
label = "Play / pause"

[[element]]
id = "voice"
region = "transport"
kind = "command"
importance = "secondary"
label = "Voice"

[[element]]
id = "speed"
region = "transport"
kind = "command"
importance = "secondary"
label = "Speed"

[[element]]
id = "reading_status"
region = "transport"
kind = "status"
importance = "tertiary"
label = "Reading status"

[[fixture]]
id = "reading"
state = "document_loaded"

[[fixture]]
id = "empty"
state = "no_document"
