[workspace]
resolver = "2"
members = ["crates/viewwright-model", "crates/viewwright-layout", "crates/viewwright-expectation", "crates/viewwright-compare", "crates/viewwright-audit", "crates/viewwright-ascii", "crates/viewwright-egui", "crates/viewwright-preview", "crates/viewwright-concept"]
[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
serde_yaml_ng = "0.10"
egui = "=0.36.2"
eframe = "=0.36.2"
