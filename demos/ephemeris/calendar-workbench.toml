[screen]
id = "ephemeris_calendar_workbench"
purpose = "Review a dense five-day calendar board with cross-day event context"
density = "dense"
root = "workspace"

[design]
character = ["structured", "high_information_density", "quiet", "legible"]
dominant = "day_wed"
avoid = ["three_column_inspector_shell", "oversized_cards", "decorative_chrome", "crushed_event_labels"]

[tokens.spacing]
sm = 6
md = 10
lg = 16

[tokens.corners]
medium = 6

[tokens.color]
canvas = "#F3F5F5"
surface = "#FFFFFF"
surface_raised = "#E8EEF0"
text = "#18252E"
text_muted = "#677780"
accent = "#226E9B"
border = "#CAD5DA"

[tokens.type]
display = 24
heading = 17
body = 13
caption = 11

[visual]
canvas = "canvas"
surface = "surface"
surface_raised = "surface_raised"
text = "text"
text_muted = "text_muted"
accent = "accent"
border = "border"
corner = "medium"
border_policy = "minimal"


[[region]]
id = "toolbar"
role = "commands"
importance = "secondary"
surface = "raised"
height = "52px"

[[region]]
id = "calendars"
role = "navigation"
importance = "secondary"
surface = "panel"
height = "75px"

[[region]]
id = "day_mon"
role = "primary_content"
importance = "secondary"
surface = "panel"
grow = 1
overflow = "scroll_y"

[[region]]
id = "day_tue"
role = "primary_content"
importance = "secondary"
surface = "panel"
grow = 1
overflow = "scroll_y"

[[region]]
id = "day_wed"
role = "primary_content"
importance = "primary"
surface = "canvas"
grow = 2
overflow = "scroll_y"

[[region]]
id = "day_thu"
role = "primary_content"
importance = "secondary"
surface = "panel"
grow = 1
overflow = "scroll_y"

[[region]]
id = "day_fri"
role = "primary_content"
importance = "secondary"
surface = "panel"
grow = 1
overflow = "scroll_y"

[[region]]
id = "event_inspector"
role = "inspector"
importance = "secondary"
surface = "raised"
height = "155px"

[[region]]
id = "sync_status"
role = "status"
importance = "tertiary"
surface = "raised"
height = "30px"

[[composition]]
id = "workspace"
kind = "column"
axis = "vertical"
children = ["toolbar", "calendars", "week_board", "event_inspector", "sync_status"]
gap = "sm"
padding = "md"

[[composition]]
id = "week_board"
kind = "row"
axis = "horizontal"
children = ["day_mon", "day_tue", "day_wed", "day_thu", "day_fri"]
gap = "sm"
grow = 1

[[element]]
id = "previous_week"
region = "toolbar"
kind = "command"
importance = "secondary"
label = "Previous week"
action = "ephemeris.view.previous_week"

[[element]]
id = "today"
region = "toolbar"
kind = "command"
importance = "primary"
label = "Today"
action = "ephemeris.view.today"

[[element]]
id = "next_week"
region = "toolbar"
kind = "command"
importance = "secondary"
label = "Next week"
action = "ephemeris.view.next_week"

[[element]]
id = "update_sources"
region = "toolbar"
kind = "command"
importance = "secondary"
label = "Update Taria sources"
action = "ephemeris.sources.refresh"

[[element]]
id = "calendar_list"
region = "calendars"
kind = "collection"
importance = "secondary"
label = "Visible calendars"
presentation = "adaptive_cards"

[[element]]
id = "monday_events"
region = "day_mon"
kind = "collection"
importance = "primary"
label = "Monday | 12 Oct"
presentation = "list"

[[element]]
id = "tuesday_events"
region = "day_tue"
kind = "collection"
importance = "primary"
label = "Tuesday | 13 Oct"
presentation = "list"

[[element]]
id = "wednesday_events"
region = "day_wed"
kind = "collection"
importance = "primary"
label = "Wednesday | 14 Oct"
presentation = "list"

[[element]]
id = "thursday_events"
region = "day_thu"
kind = "collection"
importance = "primary"
label = "Thursday | 15 Oct"
presentation = "list"

[[element]]
id = "friday_events"
region = "day_fri"
kind = "collection"
importance = "primary"
label = "Friday | 16 Oct"
presentation = "list"

[[element]]
id = "event_details"
region = "event_inspector"
kind = "property_sheet"
importance = "secondary"
label = "Selected event details"

[[element]]
id = "source_health"
region = "sync_status"
kind = "status"
importance = "tertiary"
label = "Temporal source health"

